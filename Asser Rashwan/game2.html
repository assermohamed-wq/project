<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light" id="navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Rock Paper Scissors</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <span class="nav-link active" id="score">Player: 0 | Computer: 0</span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-secondary" id="themeToggle">
              <i class="fas fa-sun"></i>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Game Section -->
  <div class="container text-center mt-5">
    <h2>Choose your move</h2>
    <div class="row">
      <div class="col">
        <button class="btn btn-primary" id="rock">Rock</button>
      </div>
      <div class="col">
        <button class="btn btn-success" id="paper">Paper</button>
      </div>
      <div class="col">
        <button class="btn btn-danger" id="scissors">Scissors</button>
      </div>
    </div>

    <!-- Game Result -->
    <div class="mt-4" id="result"></div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JavaScript -->
  <script>
    // Variables
    let playerScore = 0;
    let computerScore = 0;

    const scoreBoard = document.getElementById('score');
    const resultDiv = document.getElementById('result');
    const themeToggle = document.getElementById('themeToggle');
    const navbar = document.getElementById('navbar');

    const moves = ['rock', 'paper', 'scissors'];

    // Theme toggle function
    let isDarkTheme = false;
    themeToggle.addEventListener('click', function() {
      isDarkTheme = !isDarkTheme;
      if (isDarkTheme) {
        document.body.style.background = 'linear-gradient(to right, #0f2027, #2c5364)';
        navbar.classList.add('navbar-dark', 'bg-dark');
        navbar.classList.remove('navbar-light', 'bg-light');
        themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
      } else {
        document.body.style.background = 'linear-gradient(to right, #f0f0f0, #ff9b5c)';
        navbar.classList.remove('navbar-dark', 'bg-dark');
        navbar.classList.add('navbar-light', 'bg-light');
        themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
      }
    });

    // Function to play the game
    function playGame(playerChoice) {
      const computerChoice = moves[Math.floor(Math.random() * moves.length)];

      if (playerChoice === computerChoice) {
        resultDiv.innerHTML = `<p>It's a draw! Both chose ${playerChoice.charAt(0).toUpperCase() + playerChoice.slice(1)}.</p>`;
      } else if (
        (playerChoice === 'rock' && computerChoice === 'scissors') ||
        (playerChoice === 'paper' && computerChoice === 'rock') ||
        (playerChoice === 'scissors' && computerChoice === 'paper')
      ) {
        playerScore++;
        resultDiv.innerHTML = `<p>You win! ${playerChoice.charAt(0).toUpperCase() + playerChoice.slice(1)} beats ${computerChoice.charAt(0).toUpperCase() + computerChoice.slice(1)}.</p>`;
      } else {
        computerScore++;
        resultDiv.innerHTML = `<p>You lose! ${computerChoice.charAt(0).toUpperCase() + computerChoice.slice(1)} beats ${playerChoice.charAt(0).toUpperCase() + playerChoice.slice(1)}.</p>`;
      }

      scoreBoard.innerHTML = `Player: ${playerScore} | Computer: ${computerScore}`;
    }

    // Event Listeners for buttons
    document.getElementById('rock').addEventListener('click', function() {
      playGame('rock');
    });
    document.getElementById('paper').addEventListener('click', function() {
      playGame('paper');
    });
    document.getElementById('scissors').addEventListener('click', function() {
      playGame('scissors');
    });
  </script>
</body>
</html>
