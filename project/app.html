<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        
        <!-- To-Do List -->
        <ul class="todo-list">
            <li><input type="checkbox" id="task1"><label for="task1">Buy groceries</label></li>
            <li><input type="checkbox" id="task2"><label for="task2">Complete homework</label></li>
            <li><input type="checkbox" id="task3"><label for="task3">Call mom</label></li>
            <li><input type="checkbox" id="task4"><label for="task4">Clean the house</label></li>
        </ul>

        <!-- Add a task form -->
        <div class="add-task">
            <input type="text" placeholder="Add a new task" id="new-task-input" />
            <button id="add-task-btn">Add Task</button>
        </div>
    </div>
</body>
</html>
